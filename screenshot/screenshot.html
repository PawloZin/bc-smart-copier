<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BC Smart Copier – Screenshot</title>
  <link rel="stylesheet" href="screenshot.css">
</head>

<body>
  <div class="bar">
    <span class="bc-badge">BC</span>
    <span class="status" id="status">Copying screenshot…</span>
    <button type="button" id="copyButton" hidden>Copy screenshot</button>
  </div>
  <img id="shot" alt="Error report screenshot" hidden>
  <script src="screenshot.js"></script>
</body>

</html>
